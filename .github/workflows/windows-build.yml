name: Windows build x64
on:
  workflow_call:
    inputs:
      repository:
        default: ${{ github.repository }}
        required: false
        type: string
      rime_plugins:
        required: false
        type: string
jobs:
  build:
    runs-on: windows-2022
    env:
      boost_version: 1.84.0
      BOOST_ROOT: ${{ github.workspace }}\deps\boost_1_84_0
      RIME_PLUGINS: ${{ inputs.rime_plugins }}
    steps:
      - name: Checkout last commit
        uses: actions/checkout@v4	
        with:
          repository: ${{ inputs.repository }}
          submodules: recursive

      - name: Configure build environment
        shell: cmd
        # 【核心调整】全面替换为现代 64 位支持的 vs2022 配置脚本
        run: |
          if exist env.vs2022.bat (
            copy env.vs2022.bat env.bat
          ) else (
            copy env.vs2019.bat env.bat
          )
          for /f "delims=" %%i in ('git describe --always') do set "git_ref_name=%%i"
          echo git_ref_name=%git_ref_name%>>"%GITHUB_ENV%"

      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v4	
        with:
          path: |
            ${{ env.BOOST_ROOT }}
          key: ${{ runner.os }}-boost-${{ env.boost_version }}-x64

      - name: Install Boost
        if: steps.cache-boost.outputs.cache-hit != 'true'
        shell: cmd
        run: call .\install_boost.bat

      - name: Check submodules
        shell: cmd
        run: git submodule > submodule-status

      - name: Force Clean and Populate All Submodules
        shell: cmd
        run: |
          echo "==== [1] Cleaning potentially corrupt submodule directories ===="
          if exist "librime" rmdir /s /q "librime"
          if exist "plum" rmdir /s /q "plum"

          echo "==== [2] Natively cloning authentic Rime submodules ===="
          git clone --depth 1 https://github.com/rime/librime.git librime
          git clone --depth 1 https://github.com/rime/plum.git plum

          echo "==== [3] Double-checking downloaded workspace directory files ===="
          echo --- Librime Contents ---
          dir librime
          echo --- Plum Contents ---
          dir plum

          echo "==== [4] Generating safety tokens for caching modules ===="
          echo submodules_fixed_successfully_x64 > submodule-status

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4	
        with:
          path: |
            librime
            plum
          key: ${{ runner.os }}-deps-${{ hashFiles('submodule-status') }}-x64

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v1.1.3

      - name: Build dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        shell: cmd
        # 【核心调整】指示第三方库构建引擎向 x64 架构看齐
        run: call .\build.bat opencc x64

      - name: Copy Rime files
        shell: cmd
        run: |
          echo "==== [1] Downloading Prebuilt Librime Assets (x64) ===="
          :: 【核心调整】严格拉取小狼毫指定的专属官方 64位(x64) 静态与动态构件包
          curl -LO https://github.com
          curl -LO https://github.com

          echo "==== [2] Safely Extracting Archives without Pipes ===="
          7z x -y -bb0 rime-08dd95f-Windows-x64.7z -olibrime\
          7z x -y -bb0 rime-deps-08dd95f-Windows-x64.7z -olibrime\

          echo "==== [3] Moving Files to Staging Paths ===="
          if not exist "include" mkdir include
          if not exist "lib" mkdir lib
          if not exist "output" mkdir output
          
          copy /Y librime\dist\include\rime_*.h include\
          copy /Y librime\dist\lib\rime.lib lib\
          copy /Y librime\dist\lib\rime.dll output\

          if not exist output\data\opencc mkdir output\data\opencc
          copy /Y librime\share\opencc\*.* output\data\opencc\
          
          echo "==== [4] Verification ===="
          dir output\data\opencc

      - name: Build Weasel
        id: build_weasel
        shell: cmd
        run: |
          :: 1. Forcefully pre-create the exact target folder paths needed by the NSIS compiler
          if not exist "output\archives" mkdir "output\archives"
          
          :: 2. Execute preset data and Hanzi data compilations (Passing x64 token flags)
          :: 【核心调整】强制向小狼毫项目主编译脚本灌入 x64 指令，改写平台生成规格
          call .\build.bat data x64
          call .\build.bat hant x64
          
          :: 3. Double-check that rime-install.bat is staged correctly in output/
          if exist "plum\rime-install.bat" copy /Y "plum\rime-install.bat" "output\"
          
          :: 4. Run the installer packaging engine cleanly
          call .\build.bat installer x64

      - name: Locate and Debug Built Installer Files
        shell: cmd
        run: |
          echo "==== Scanning entire output directory for generated files ===="
          dir /s output\weasel*.exe
          dir /s output\*.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weasel-build-package-x64
          if-no-files-found: error
          path: |
            output\**\weasel*.exe
            output\*.exe
