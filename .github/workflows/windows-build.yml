name: Windows build
on:
  workflow_call:
    inputs:
      repository:
        default: ${{ github.repository }}
        required: false
        type: string
      rime_plugins:
        required: false
        type: string
jobs:
  build:
    runs-on: windows-2022
    env:
      boost_version: 1.84.0
      BOOST_ROOT: ${{ github.workspace }}\deps\boost_1_84_0
      RIME_PLUGINS: ${{ inputs.rime_plugins }}
    steps:
      - name: Checkout last commit
        uses: actions/checkout@v4	
        with:
          repository: ${{ inputs.repository }}
          submodules: recursive

      - name: Configure build environment
        run: |
          copy env.vs2022.bat env.bat
          $git_ref_name = git describe --always
          echo "git_ref_name=$git_ref_name" >> $env:GITHUB_ENV


      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v4	
        with:
          path: |
            ${{ env.BOOST_ROOT }}
          key: ${{ runner.os }}-boost-${{ env.boost_version }}

      - name: Install Boost
        if: steps.cache-boost.outputs.cache-hit != 'true'
        run: .\install_boost.bat

      - name: Check submodules
        run: git submodule > submodule-status


      - name: Force Clean and Populate All Submodules
        shell: cmd
        run: |
          echo "==== [1] Cleaning potentially corrupt submodule directories ===="
          :: 强行清除任何可能残存的、带毒的空文件夹（比如之前那个只有 b.txt 的空壳）
          if exist "librime" rmdir /s /q "librime"
          if exist "plum" rmdir /s /q "plum"

          echo "==== [2] Natively cloning authentic Rime submodules ===="
          :: 直接绕过繁琐的本地 Git 状态链，就地秒级克隆最纯净的官方指定版本源码
          git clone --depth 1 https://github.com/rime/librime.git librime
          git clone --depth 1 https://github.com/rime/plum.git plum

          echo "==== [3] Double-checking downloaded workspace directory files ===="
          :: 打印拉取后的真实目录内容，让你在 GitHub Actions 网页日志中一眼看清有没有拉全
          echo --- Librime Contents ---
          dir librime
          echo --- Plum Contents ---
          dir plum

          echo "==== [4] Generating safety tokens for caching modules ===="
          :: 生成状态锚点文件，安抚后续可能需要的缓存检查逻辑
          echo submodules_fixed_successfully > submodule-status


      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4	
        with:
          path: |
            librime
            plum
          key: ${{ runner.os }}-deps-${{ hashFiles('submodule-status') }}

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v1.1.3

      - name: Build dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: .\build.bat opencc

      - name: Copy Rime files
        shell: cmd
        run: |
          echo "==== [1] Downloading Prebuilt Librime Assets ===="
          :: 模拟脚本原本的 curl 下载逻辑，确保抓取到正确的包
          curl -LO https://github.com/rime/librime/releases/download/1.8.5/rime-08dd95f-Windows.7z
          curl -LO https://github.com/rime/librime/releases/download/1.8.5/rime-deps-08dd95f-Windows.7z

          echo "==== [2] Safely Extracting Archives without Pipes ===="
          :: 【核心修复】使用 -y 自动覆盖，并使用 -bb0 完全关闭文件路径的打印，100% 避免 Break 信号
          7z x -y -bb0 rime-08dd95f-Windows.7z -olibrime\
          7z x -y -bb0 rime-deps-08dd95f-Windows.7z -olibrime\

          echo "==== [3] Moving Files to Staging Paths ===="
          :: 严格执行原脚本所需的复制逻辑，打通小狼毫编译依赖
          if not exist "include" mkdir include
          if not exist "lib" mkdir lib
          if not exist "output" mkdir output
          
          copy /Y librime\dist\include\rime_*.h include\
          copy /Y librime\dist\lib\rime.lib lib\
          copy /Y librime\dist\lib\rime.dll output\

          if not exist output\data\opencc mkdir output\data\opencc
          copy /Y librime\share\opencc\*.* output\data\opencc\
          
          echo "==== [4] Verification ===="
          dir output\data\opencc



      - name: Build Weasel
        id: build_weasel
        run: |
          .\build.bat data
          .\build.bat hant
          .\build.bat installer

      - name: Upload artifacts
        uses: actions/upload-artifact@v4	
        with:
          if-no-files-found: error
          path: |
            .\output\archives\weasel*.exe
