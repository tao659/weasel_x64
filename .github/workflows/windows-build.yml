name: Windows build
on:
  workflow_call:
    inputs:
      repository:
        default: ${{ github.repository }}
        required: false
        type: string
      rime_plugins:
        required: false
        type: string
jobs:
  build:
    runs-on: windows-2022
    env:
      boost_version: 1.84.0
      BOOST_ROOT: ${{ github.workspace }}\deps\boost_1_84_0
      RIME_PLUGINS: ${{ inputs.rime_plugins }}
    steps:
      - name: Checkout last commit
        uses: actions/checkout@v4	
        with:
          repository: ${{ inputs.repository }}
          submodules: recursive

      - name: Configure build environment
        run: |
          copy env.vs2022.bat env.bat
          $git_ref_name = git describe --always
          echo "git_ref_name=$git_ref_name" >> $env:GITHUB_ENV


      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v4	
        with:
          path: |
            ${{ env.BOOST_ROOT }}
          key: ${{ runner.os }}-boost-${{ env.boost_version }}

      - name: Install Boost
        if: steps.cache-boost.outputs.cache-hit != 'true'
        run: .\install_boost.bat

      - name: Check submodules
        run: git submodule > submodule-status


      - name: Verify Plum Submodule Fetch Status
        shell: cmd
        run: |
          echo "==== [1] Checking Git Submodule Status ===="
          git submodule status
          
          echo "==== [2] Checking Plum Directory Contents ===="
          if exist "plum" (
              dir plum
          ) else (
              echo "Error: 'plum' directory does not even exist!"
          )
          
          echo "==== [3] Checking Core File Presence ===="
          if exist "plum\rime-install" (
              echo "Success: 'plum\rime-install' core script found!"
          ) else (
              echo "Warning: 'plum\rime-install' is missing. Submodule might be empty."
          )


      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4	
        with:
          path: |
            librime
            plum
          key: ${{ runner.os }}-deps-${{ hashFiles('submodule-status') }}

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v1.1.3

      - name: Build dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: .\build.bat opencc

      - name: Copy Rime files
        run: .\github.install.bat


      - name: Build Weasel
        id: build_weasel
        run: |
          .\build.bat data
          .\build.bat hant
          .\build.bat installer

      - name: Upload artifacts
        uses: actions/upload-artifact@v4	
        with:
          if-no-files-found: error
          path: |
            .\output\archives\weasel*.exe
