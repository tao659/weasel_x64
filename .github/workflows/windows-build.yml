name: Windows build
on:
  workflow_call:
    inputs:
      repository:
        default: ${{ github.repository }}
        required: false
        type: string
      rime_plugins:
        required: false
        type: string
jobs:
  build:
    runs-on: windows-2022
    env:
      boost_version: 1.84.0
      BOOST_ROOT: ${{ github.workspace }}\deps\boost_1_84_0
      RIME_PLUGINS: ${{ inputs.rime_plugins }}
    steps:
      - name: Checkout last commit
        uses: actions/checkout@v4	
        with:
          repository: ${{ inputs.repository }}
          submodules: recursive

      - name: Configure build environment
        run: |
          :: 1. Copy the environment baseline
          copy env.vs2019.bat env.bat
          
          :: 2. FORCE the target platform environment variables to x64
          echo set ARCH=x64>>env.bat
          echo set PLATFORM=x64>>env.bat
          echo set RIME_PLATFORM=x64>>env.bat
          
          :: 3. Export the standard git ref name
          for /f "tokens=*" %%i in ('git describe --always') do set git_ref_name=%%i
          echo git_ref_name=%git_ref_name%>>"%GITHUB_ENV%"


      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v4	
        with:
          path: |
            ${{ env.BOOST_ROOT }}
          key: ${{ runner.os }}-boost-${{ env.boost_version }}

      - name: Install Boost
        if: steps.cache-boost.outputs.cache-hit != 'true'
        run: .\install_boost.bat

      - name: Check submodules
        run: git submodule > submodule-status

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4	
        with:
          path: |
            librime
            plum
          key: ${{ runner.os }}-deps-${{ hashFiles('submodule-status') }}

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v1.1.3

      - name: Build dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: .\build.bat opencc

      - name: Copy Rime files
        run: .\github.install.bat


      - name: Build Weasel
        id: build_weasel
        run: |
          .\build.bat data
          .\build.bat hant
          .\build.bat installer

      - name: Upload artifacts
        uses: actions/upload-artifact@v4	
        with:
          if-no-files-found: error
          path: |
            .\output\archives\weasel*.exe
